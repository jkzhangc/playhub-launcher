name: Build Windows alpha

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Pre-release tag
        required: true
        default: v0.2.0-alpha

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install public build dependencies
        run: |
          python -m pip install -r requirements.txt
          npm install --prefix . --no-save playwright-core
      - name: Run public tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s tests -v
          node tools/test_cloud_flow.cjs
      - name: Build and smoke-test client
        run: python tools/build_windows.py
      - name: Preserve tested artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PlayHub-Windows-Alpha
          path: |
            dist/*.zip
            dist/*.sha256
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+-alpha([.-][0-9]+)?$') { throw "Expected a versioned alpha tag." }
          gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -eq 0) { throw "Release already exists; refusing to replace its assets." }
          $assets = @(Get-ChildItem -Path dist -File | Where-Object { $_.Name -like '*.zip' -or $_.Name -like '*.sha256' } | ForEach-Object { $_.FullName })
          if ($assets.Count -lt 2) { throw "Release archive or checksum is missing." }
          gh release create "$env:RELEASE_TAG" @assets --repo "$env:GITHUB_REPOSITORY" --prerelease --title "PlayHub $env:RELEASE_TAG" --notes-file release-notes.txt
          if ($LASTEXITCODE -ne 0) { throw "Pre-release upload failed." }
